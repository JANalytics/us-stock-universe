name: Refresh US company list

on:
  schedule:
    # Every Monday at 13:00 UTC (~9am US Eastern).
    # Cron uses UTC.
    - cron: "0 13 * * 1"

  workflow_dispatch:
    inputs:
      max_companies:
        description: "Optional: limit companies for testing"
        required: false
        default: ""

      sec_public_date_lookup:
        description: "Search SEC registration filings for public dates"
        required: false
        default: "1"

jobs:
  refresh:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ---------------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------------

      - name: Check out repo
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # PYTHON
      # ---------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------------------------------
      # OPTIONAL EXCEL SUPPORT
      # ---------------------------------------------------------------

      - name: Install optional dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      # ---------------------------------------------------------------
      # RUN FETCH SCRIPT
      # ---------------------------------------------------------------

      - name: Run fetch script
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

          MAX_COMPANIES: ${{ github.event.inputs.max_companies }}

          SEC_PUBLIC_DATE_LOOKUP: ${{ github.event.inputs.sec_public_date_lookup || '1' }}

          SEC_REQUEST_DELAY: "0.12"

        run: |
          python fetch_us_stock_universe.py

      # ---------------------------------------------------------------
      # SHOW RESULT SUMMARY
      # ---------------------------------------------------------------

      - name: Show output summary
        run: |
          echo "CSV row count:"
          wc -l us_listed_companies.csv

          echo ""
          echo "First 10 rows:"
          head -n 10 us_listed_companies.csv

          echo ""
          echo "Rows containing SEC Public Date:"
          python - <<'PY'
          import csv

          path = "us_listed_companies.csv"

          with open(path, newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))

          populated = [
              r for r in rows
              if r.get("SEC Public Date")
          ]

          print(
              f"{len(populated)} of "
              f"{len(rows)} companies have an SEC Public Date."
          )

          for row in populated[:20]:
              print(
                  row["Ticker"],
                  row["SEC Public Date"],
                  row["Company Name"],
                  sep=" | "
              )
          PY

      # ---------------------------------------------------------------
      # COMMIT UPDATED FILES
      # ---------------------------------------------------------------

      - name: Commit updated file(s)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add us_listed_companies.csv
          git add us_listed_companies.xlsx || true

          if git diff --quiet --cached; then
            echo "No changes to commit."
          else
            git commit -m "Auto-refresh US company list"
            git push
          fi
