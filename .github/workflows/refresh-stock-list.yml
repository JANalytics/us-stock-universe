name: Refresh US company list

on:
  schedule:
    # Every Monday at 13:00 UTC (~9am US Eastern). Cron uses UTC always.
    # Edit this if you want a different day/time or frequency.
    - cron: '0 13 * * 1'
  workflow_dispatch: {}   # adds a "Run workflow" button so you can trigger it manually

permissions:
  contents: write   # lets the workflow commit the updated CSV back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install optional dependencies (for .xlsx output)
        run: pip install pandas openpyxl

      - name: Run fetch script
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python fetch_us_stock_universe.py

      - name: Commit updated file(s)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add us_listed_companies.csv
          git add us_listed_companies.xlsx || true
          git diff --quiet --cached || git commit -m "Auto-refresh US company list"
          git push
